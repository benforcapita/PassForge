name: desktop-test

on:
  push:
    branches: [main]
    paths: ["desktop/**", "crates/**", "Cargo.toml", "Cargo.lock", ".github/workflows/desktop-test.yml"]
  pull_request:
    paths: ["desktop/**", "crates/**", "Cargo.toml", "Cargo.lock", ".github/workflows/desktop-test.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tauri system deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable corepack / yarn
        run: corepack enable

      - name: Install workspace deps
        run: yarn install --immutable

      - name: Frontend tests
        run: yarn workspace passforge-desktop test

      - name: Frontend build
        run: yarn workspace passforge-desktop build

      - name: Rust tests
        run: cargo test -p passforge-desktop -p lesspass-core -p passforge-protocol -p passforge-server

<svg xmlns="http://www.w3.org/2000/svg" width="660" height="400" viewBox="0 0 660 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#070A0F"/>
    </linearGradient>
    <linearGradient id="key" x1="300" y1="30" x2="360" y2="105" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#06B6D4" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="660" height="400" fill="url(#bg)"/>
  <ellipse cx="330" cy="200" rx="280" ry="180" fill="url(#glow)"/>

  <!-- forge key mark, top centre (icon slots at y~220 stay clear) -->
  <g fill="url(#key)">
    <path fill-rule="evenodd" d="M330 30 L354 44 L354 72 L330 86 L306 72 L306 44 Z
                                 M330 45 L344 53 L344 63 L330 71 L316 63 L316 53 Z"/>
    <rect x="323" y="82" width="14" height="52" rx="5"/>
    <rect x="337" y="112" width="22" height="9" rx="3.5"/>
    <rect x="337" y="126" width="16" height="9" rx="3.5"/>
  </g>

  <!-- subtle arrow from the app icon (180,220) to Applications (480,220) -->
  <path d="M252 220 H 408" stroke="#484F58" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="1 9"/>
  <path d="M408 220 L396 213 M408 220 L396 227" stroke="#484F58" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <text x="330" y="330" text-anchor="middle" font-family="-apple-system, Helvetica, Arial, sans-serif"
        font-size="15" fill="#8B949E">Drag PassForge to Applications</text>
</svg>

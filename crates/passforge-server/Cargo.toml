[package]
name = "passforge-server"
description = "Reference server for the PassForge remote algorithm protocol"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "passforge_server"
path = "src/lib.rs"

[[bin]]
name = "passforge-server"
path = "src/main.rs"

[dependencies]
passforge-protocol = { path = "../passforge-protocol" }
axum.workspace = true
tokio.workspace = true
tower-http.workspace = true
argon2.workspace = true
pbkdf2.workspace = true
sha2.workspace = true
hmac.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
zeroize.workspace = true

[dev-dependencies]
tower.workspace = true
http-body-util.workspace = true
lesspass-core = { path = "../lesspass-core" }

[package]
name = "passforge-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "passforge-desktop"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
lesspass-core = { path = "../../crates/lesspass-core" }
passforge-protocol = { path = "../../crates/passforge-protocol" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
hex.workspace = true
ureq = { version = "2", features = ["json"] }
url = "2"
tauri = { version = "2", features = [] }
tauri-plugin-biometric = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["time", "rt-multi-thread", "macros", "net"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
zeroize = "1"
chacha20poly1305 = "0.10"
hkdf = "0.12"
pbkdf2 = "0.12"
subtle = "2"
csv = "1"
hmac = "0.12"
p256 = { version = "0.13", features = ["ecdsa"] }
rand.workspace = true
base64 = "0.22"
sha2.workspace = true
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled-sqlcipher", "chrono", "uuid"] }
dirs = "6"
tauri-plugin-opener = "2.7.2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-local-authentication = "0.3.2"
security-framework = "3"

[dev-dependencies]
tempfile = "3"
sha2.workspace = true
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
passforge-server = { path = "../../crates/passforge-server" }
base64 = "0.22"
